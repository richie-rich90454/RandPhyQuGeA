<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RandPhyQuGeA — Solid (migration preview)</title>
        <meta name="application-name" content="RandPhyQuGeA Solid" />
        <meta name="theme-color" content="#0b2540" />
        <script>
			(function(){
				try{
					var raw=localStorage.getItem("solid-theme");
					var mode=raw ? JSON.parse(raw) : "system";
					var isDark=mode === "dark" || (mode === "dim") || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
				}catch(e){
					document.documentElement.setAttribute("data-theme", window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
				}
			})();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <noscript>
            <div style="font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1.5rem; text-align: center; color: #0b2540">
                <h1>JavaScript Required</h1>
                <p>The RandPhyQuGeA Solid preview needs JavaScript to run. Please enable JavaScript in your browser settings and reload this page.</p>
            </div>
        </noscript>
        <script type="module" src="./main.tsx"></script>
    </body>
</html>
